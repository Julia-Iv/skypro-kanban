<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>skypro-kanban</title>
    <link rel="preconnect" href="https://googleapis.com" />
    <link rel="preconnect" href="https://gstatic.com" crossorigin />
    <link
      href="https://googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <!-- Стильная анимация, которая видна ДО загрузки React-кода -->
      <div class="pre-loader-container">
        <div class="pre-loading-spinner"></div>
      </div>

      <style>
        .pre-loader-container {
          display: flex;
          justify-content: center;
          align-items: center;
          width: 100vw;
          height: 100vh;
          background-color: #eaeef6; /* Фирменный серый фон приложения */
          position: fixed;
          top: 0;
          left: 0;
          z-index: 9999;
        }

        .pre-loading-spinner {
          width: 50px;
          height: 50px;
          border: 4px solid rgba(0, 123, 255, 0.1);
          border-radius: 50%;
          border-top-color: #565eef; /* Фирменный фиолетово-синий цвет Skypro */
          animation: pre-spin 1s linear infinite;
        }

        @keyframes pre-spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
